[project]
name = "todoist-cli"
version = "0.1.0"
description = "Todoist CLI - Manage your tasks from the command line"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.12.3",
    "python-dotenv>=1.1.1",
    "questionary>=2.1.1",
    "requests>=2.32.4",
    "rich>=14.0.0",
    "textual>=3.3.0",
    "typer>=0.20.0",
]

[project.scripts]
todoist = "main:app"
